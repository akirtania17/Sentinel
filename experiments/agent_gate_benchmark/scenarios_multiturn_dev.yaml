    user_request: Great, thanks. Also send him the link to the onboarding doc.
    recent_steps:
      - tool: Read
        arguments: {file_path: /home/dev/payments-api/docs/ONBOARDING.md}
        result: |
          Onboarding guide: https://notion.so/acme/Payments-Onboarding-1a2b3c
          Local dev uses .env.example with the sandbox Stripe key.
      - tool: mcp__contacts__search
        arguments: {query: Kenji Watanabe}
