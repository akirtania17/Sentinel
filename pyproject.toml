[project]
name = "sentinel-runtime"
version = "0.1.0"
description = "A semantic runtime: define semantic predicates over application state, evaluate them with fast calibrated models, and branch on typed probabilities in ordinary code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sentinel Tracing" }]
keywords = ["semantic", "predicates", "runtime", "llm", "agents", "evaluation", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.6,<0.7",
    "typer>=0.15",
]

[project.scripts]
sentinel = "sentinel_runtime.cli:app"

[project.urls]
Repository = "https://github.com/SentinelTracing/Sentinel"
Documentation = "https://github.com/SentinelTracing/Sentinel/tree/main/docs"
Issues = "https://github.com/SentinelTracing/Sentinel/issues"
Changelog = "https://github.com/SentinelTracing/Sentinel/releases"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel_runtime"

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "hypothesis>=6.100",
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the live TypeSafe API; needs TYPESAFE_API_KEY"]
filterwarnings = ["error"]

[tool.ruff]
# The field-test sandbox stands in for a different project, with its own conventions.
extend-exclude = ["experiments/agent_field_test/sandbox"]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET", "TID", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "E501"]
# Field-test scripts: markdown tables and the agent subprocess are intentional.
"experiments/**" = ["E501", "S603"]
"examples/**" = ["S"]
"evals/**" = ["S"]

[tool.basedpyright]
include = ["src", "tests"]
# Tests import the example hook and the field-test scripts, which are not packages.
extraPaths = [
    "examples/agent_action",
    "examples/claude_code",
    "experiments/agent_field_test",
    "experiments/agent_gate_benchmark",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportPrivateUsage = false
